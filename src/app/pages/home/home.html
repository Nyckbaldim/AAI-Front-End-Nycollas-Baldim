<div class="bg-success text-white text-center fs-4 py-1 mb-2">
  Tarefas - {{ hoje | date:'dd/MM/yyyy' }}
</div>

<div class="d-flex justify-content-end mb-3">
  <button class="btn btn-primary btn-sm" routerLink="/tarefa-nova">
    Adicionar <i class="bi bi-plus-circle"></i>
  </button>
</div>

<div class="row justify-content-center">
  <div class="col-12 col-md-4 mb-3" *ngFor="let t of tarefas">
    <div class="card">
      <div class="card-body">
        <small class="fw-bold text-uppercase"
               [ngClass]="{
                 'text-danger': t.prioridade === 'Alto',
                 'text-warning': t.prioridade === 'Médio',
                 'text-success': t.prioridade === 'Baixo'
               }">{{ t.prioridade }}</small>
        <h6><i class="bi bi-circle-fill text-success"></i> {{ t.nome }}</h6>
        <p class="text-muted fw-bold small">
          Vencimento {{ t.data | date:'dd/MM/yyyy' }}
        </p>
        <button class="btn btn-warning btn-sm me-2" (click)="editar(t.id)">
          Editar <i class="bi bi-pencil-square"></i>
        </button>
        <button class="btn btn-danger btn-sm" (click)="deletar(t.id)">
          Deletar <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
  </div>
</div>
