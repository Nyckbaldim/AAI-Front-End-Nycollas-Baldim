<div class="bg-success text-white text-center fs-4 py-1 mb-3">Atualiza Tarefa</div>

<div class="mb-3">
  <label class="form-label">Nome</label>
  <input type="text" class="form-control" name="nome" [(ngModel)]="tarefa.nome">
</div>

<div class="mb-3">
  <label class="form-label">Prioridade</label>
  <select class="form-select" name="prioridade" [(ngModel)]="tarefa.prioridade">
    <option>Alto</option>
    <option>Médio</option>
    <option>Baixo</option>
  </select>
</div>

<div class="mb-3">
  <label class="form-label">Data limite</label>
  <input type="date" class="form-control" name="data" [(ngModel)]="tarefa.data">
</div>

<div class="mb-3">
  <label class="form-label">Categoria</label>
  <input type="text" class="form-control mb-2" name="categoria"
         [(ngModel)]="tarefa.categoria" readonly>
  <button *ngFor="let c of categorias" type="button"
          class="btn btn-outline-primary btn-sm me-2"
          (click)="selecionarCategoria(c)">{{ c }}</button>
</div>

<button class="btn btn-warning" (click)="atualizar()">Atualizar</button>
